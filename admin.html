<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>管理後台 | ARCHITECT AI SYSTEM</title>
    <link rel="stylesheet" href="./styles.css?v=admin-page-20261014-r1" />
    <link rel="stylesheet" href="./admin.css?v=20261014-r1" />
  </head>
  <body class="admin-page">
    <header class="admin-page-header">
      <div class="admin-page-header-inner">
        <a class="admin-brand" href="./"><span class="admin-brand-symbol">A</span><span>ARCHITECT AI SYSTEM<small>管理後台</small></span></a>
        <div class="admin-page-account"><span id="adminIdentity">確認登入中</span><a class="text-button" href="./">返回主網站 ↗</a></div>
      </div>
      <nav class="admin-page-nav" role="tablist" aria-label="管理後台功能">
        <button type="button" role="tab" id="membersTab" aria-controls="membersPanel" aria-selected="true" tabindex="0">會員管理</button>
        <button type="button" role="tab" id="monitorTab" aria-controls="monitorPanel" aria-selected="false" tabindex="-1">主機與排單監控</button>
      </nav>
    </header>
    <main class="admin-page-main">
      <section class="admin-access-state" id="adminGate" aria-live="polite">
        <p class="panel-kicker">ADMIN ACCESS</p>
        <h1 id="adminGateTitle">正在確認管理員權限</h1>
        <p id="adminGateMessage">將沿用主網站的登入狀態。</p>
        <div class="admin-gate-actions"><button class="primary-button compact" id="adminRetry" type="button">重新確認權限</button><a class="text-button" href="./" target="_blank" rel="noopener noreferrer">前往主網站登入</a></div>
      </section>
      <div id="adminContent" hidden inert>
        <section id="membersPanel" role="tabpanel" aria-labelledby="membersTab" tabindex="0">
          <div class="admin-page-section-header">
            <div><p class="panel-kicker">MEMBERS</p><h1>會員管理</h1><p>管理帳號、使用額度與功能開通。</p></div>
            <button class="primary-button compact" id="adminRefresh" type="button">重新整理會員</button>
          </div>
          <p id="adminMessage" class="admin-page-message" role="status"></p>
          <div class="admin-overview" id="adminOverview"></div>
          <div class="admin-member-list" id="adminMemberList"></div>
          <section class="admin-detail" id="adminDetail" hidden>
            <div class="admin-detail-header"><div><p class="panel-kicker">MEMBER DETAIL</p><h2 id="adminDetailTitle">會員明細</h2></div><button class="text-button" id="adminDetailClose" type="button">關閉明細</button></div>
            <div id="adminDetailContent"></div>
          </section>
        </section>
        <section id="monitorPanel" role="tabpanel" aria-labelledby="monitorTab" tabindex="0" hidden>
          <div class="admin-page-section-header"><div><p class="panel-kicker">OPERATIONS</p><h1>主機與排單監控</h1><p>查看排單服務與各工作程式的最新回報。</p></div></div>
          <section id="adminMonitor" class="admin-monitor" aria-label="主機與排單監控"></section>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js?v=member-usage-20260604"></script>
    <script type="module" src="./admin-page.js?v=20261014-r1"></script>
  </body>
</html>
